snapshots:
  - name: gold_items # Name of the snapshot. This is used to create the table name in the database.
    relation: ref('source_gold_items') # Reference to the source table or model that we want to snapshot.
    config:
      schema: gold # Specifies the schema where the snapshot table will be created.
      database: dbt_tutorial_dev # Specifies the database where the snapshot table will be created.
      unique_key: id
      strategy: timestamp #
      updated_at: updated_at # Specifies the column that will be used to determine if a record has changed. In this case, we are using the `updated_at` column to track changes in the source table.
      dbt_valid_to_current: "to_date('9999-12-31')" # Specifies that current records should have `dbt_valid_to` set to `'9999-12-31'` instead of `NULL`.
